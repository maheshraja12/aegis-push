name: AEGIS CI

on:
  push:
    branches: ["main", "chore/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements_v3.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_v3.txt pytest
      - name: Compile Python modules
        run: python -m compileall -q aegis_v3 run_aegis_v3.py
      - name: Run unit tests
        run: pytest -q tests
